services:
  postgres:
    image: postgres:16
    container_name: ika6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ika6
      POSTGRES_USER: ika6
      POSTGRES_PASSWORD: ika6-local-password
    ports:
      - "5432:5432"
    volumes:
      - ika6-postgres-data:/var/lib/postgresql/data

volumes:
  ika6-postgres-data:
