<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>动物混战</title>
  <style>
    :root {
      color-scheme: dark;
      background: #090b10;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090b10;
      touch-action: none;
      user-select: none;
    }

    #game-root {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      background: #090b10;
      touch-action: none;
    }
  </style>
</head>
<body>
  <main id="game-root" aria-label="动物混战">
    <noscript>请启用 JavaScript 后再开始游戏。</noscript>
  </main>
  <script src="./web-adapter.js"></script>
  <script type="module" src="./game.js"></script>
</body>
</html>
